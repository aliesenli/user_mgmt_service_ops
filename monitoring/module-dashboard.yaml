apiVersion: v1
kind: ConfigMap
metadata:
  name: module-service-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  module-service-dashboard.json: |
    {
      "title": "Module Service",
      "uid": "module-service",
      "version": 1,
      "schemaVersion": 38,
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "Request Rate (req/s)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [{
            "expr": "sum(rate(http_requests_total{job=~\".*module-service.*\"}[5m])) by (handler)",
            "legendFormat": "{{handler}}"
          }]
        },
        {
          "id": 2,
          "title": "Response Time p50 / p95 (s)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket{job=~\".*module-service.*\"}[5m])) by (le, handler))",
              "legendFormat": "p50 {{handler}}"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=~\".*module-service.*\"}[5m])) by (le, handler))",
              "legendFormat": "p95 {{handler}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "Error Rate (%)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8},
          "targets": [{
            "expr": "sum(rate(http_requests_total{job=~\".*module-service.*\", status=~\"5..\"}[5m])) / sum(rate(http_requests_total{job=~\".*module-service.*\"}[5m])) * 100",
            "legendFormat": "Error Rate %"
          }]
        }
      ]
    }
