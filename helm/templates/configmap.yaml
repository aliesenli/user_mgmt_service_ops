apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "user-mgmt.labels" . | nindent 4 }}
data:
  SPRING_JPA_HIBERNATE_DDL_AUTO: {{ .Values.config.springJpaHibernateDdlAuto | quote }}
  JWT_ISSUER: {{ .Values.config.jwtIssuer | quote }}
  JWT_EXPIRATION_MILLIS: {{ .Values.config.jwtExpirationMillis | quote }}
  MODULE_SERVICE_URL: "http://module-service.{{ .Values.namespace }}.svc.cluster.local"
