namespace: user-mgmt
backend:
  image:
    repository: ghcr.io/aliesenli/user-mgmt-backend
    tag: fd76cb5ae9976cfacfa37db98f21839f8e3e70ff
  replicas: 1
  port: 8080
  readinessProbe:
    initialDelaySeconds: 90
    periodSeconds: 10
    failureThreshold: 6
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  hpa:
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
frontend:
  image:
    repository: ghcr.io/aliesenli/user-mgmt-frontend
    tag: fd76cb5ae9976cfacfa37db98f21839f8e3e70ff
  replicas: 1
  port: 3000
  apiUrl: "https://app.aliesenli.com/api"
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"
postgres:
  image:
    repository: postgres
    tag: 16-alpine
  replicas: 1
  port: 5432
  storage: 1Gi
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "300m"
      memory: "256Mi"
config:
  springDatasourceUrl: "jdbc:postgresql://postgres:5432/userdb"
  springJpaHibernateDdlAuto: "update"
  jwtIssuer: "user-mgmt-service"
  jwtExpirationMillis: "3600000"
secret:
  postgresUser: "appuser"
  postgresPassword: "secret"
  postgresDb: "userdb"
  jwtSecret: "change-me-to-a-long-random-string"
ingress:
  className: nginx
  host: app.aliesenli.com

resourceQuota:
  cpu: "1"
  memory: "1Gi"
