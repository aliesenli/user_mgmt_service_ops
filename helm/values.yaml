namespace: user-mgmt
backend:
  image:
    repository: ghcr.io/aliesenli/user-mgmt-backend
    tag: c23ccf2969b216c4182e3fabf1a9d48aaa8c4970
  replicas: 1
  port: 8080
  readinessProbe:
    initialDelaySeconds: 90
    periodSeconds: 10
    failureThreshold: 6
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  hpa:
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
frontend:
  image:
    repository: ghcr.io/aliesenli/user-mgmt-frontend
    tag: c23ccf2969b216c4182e3fabf1a9d48aaa8c4970
  replicas: 1
  port: 3000
  apiUrl: "https://app.aliesenli.com/api"
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"
config:
  springJpaHibernateDdlAuto: "update"
  jwtIssuer: "user-mgmt-service"
  jwtExpirationMillis: "3600000"
ingress:
  className: nginx
  host: app.aliesenli.com
moduleService:
  image:
    repository: ghcr.io/aliesenli/module-service
    tag: edab20a92261a204df6fed168de052eb37fa7392
  replicas: 1
  port: 8000
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "300m"
      memory: "256Mi"
resourceQuota:
  cpu: "2"
  memory: "2Gi"
